<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="file-version" id="html-version" content="1.5">
    <title>Build-GuiForge</title>
    <link rel="stylesheet" href="css/themes.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: #1e1e1e; color: #d4d4d4; user-select: none; }
        
        #toolbox { width: 200px; background: #252526; border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; z-index: 10; }
        .tool-btn { padding: 10px; background: #3c3c3c; border: 1px solid #555; color: white; cursor: pointer; text-align: left; border-radius: 4px; }
        .tool-btn:hover { background: #505050; }
        .danger-btn { background: #a80000; text-align: center; margin-top: 15px; }
        .danger-btn:hover { background: #d10000; }

        #workspace { flex: 1; padding: 20px; background: #333; display: flex; justify-content: center; align-items: center; overflow: auto; position: relative; }
        
        #live-preview-canvas { width: 650px; height: 450px; position: relative; overflow: hidden; margin-top: 30px; }
        
        #properties-panel { width: 320px; background: #252526; border-left: 1px solid #333; display: flex; flex-direction: column; z-index: 10; }
        #props-header { padding: 15px; background: #1e1e1e; border-bottom: 1px solid #333; font-weight: bold; }
        #props-content { flex: 1; overflow-y: auto; }
        .prop-group { padding: 10px 15px; border-bottom: 1px solid #333; display: flex; flex-direction: column; gap: 5px; }
        .prop-group label { font-size: 0.85em; color: #aaa; }
        .prop-group input, .prop-group textarea, .prop-group select { width: 100%; padding: 5px; background: #1e1e1e; border: 1px solid #555; color: white; box-sizing: border-box; }
        .prop-group textarea { resize: vertical; min-height: 60px; font-family: Consolas, monospace; }
        
        .nudge-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 5px; margin-top: 5px; }
        .nudge-btn { background: #3c3c3c; border: 1px solid #555; color: white; padding: 5px; cursor: pointer; text-align: center; font-size: 0.8em; }
        .nudge-btn:hover { background: #0078d4; }

        .canvas-element { position: absolute; cursor: move; padding: 4px; box-sizing: border-box; min-width: 100px; }
        .canvas-element:hover { outline: 1px dashed #0078d4; }
        .selected-element { outline: 2px solid #0078d4 !important; z-index: 5; }
        
        /* Disable interaction on inner elements unless interact mode is active */
        .canvas-element:not(.interactive) * { pointer-events: none; }

        #settings-modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center; }
        .modal-content { background: #252526; padding: 20px; border: 1px solid #555; width: 400px; border-radius: 5px; box-shadow: 0 4px 15px rgba(0,0,0,0.8); }
        .version-list { list-style: none; padding: 0; font-family: Consolas, monospace; color: #4af626; background: #000; padding: 10px; border-radius: 4px; }
    </style>
</head>
<body>

    <div id="toolbox">
        <h3 style="margin-top:0;">Toolbox</h3>
        <button class="tool-btn" onclick="addControl('Button')">➕ Button</button>
        <button class="tool-btn" onclick="addControl('TextBox')">➕ TextBox</button>
        <button class="tool-btn" onclick="addControl('Label')">➕ Label</button>
        <button class="tool-btn" onclick="addControl('CheckBox')">➕ CheckBox</button>
        <button class="tool-btn" onclick="addControl('Dropdown')">➕ Dropdown</button>
        
        <div style="flex-grow: 1;"></div>
        <button class="tool-btn" onclick="openSettings()" style="text-align: center;">⚙️ Settings</button>
    </div>

    <div id="workspace">
        <div id="live-preview-canvas" data-title="My Custom Tool">
            <!-- Elements dropped here -->
        </div>
    </div>

    <div id="properties-panel">
        <div id="props-header">Properties</div>
        <div id="props-content"></div>
    </div>

    <div id="settings-modal">
        <div class="modal-content">
            <h3 style="margin-top:0; border-bottom: 1px solid #444; padding-bottom: 10px;">System Settings</h3>
            <h4>Loaded Components</h4>
            <ul id="version-list-container" class="version-list"></ul>
            <button class="tool-btn" onclick="closeSettings()" style="width:100%; margin-top:15px; text-align: center;">Close</button>
        </div>
    </div>

    <script src="js/engine.js"></script>
</body>
</html>
