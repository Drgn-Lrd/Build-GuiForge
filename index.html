<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta id="html-version" content="1.10">
    <title>PowerShell GUI Form Designer</title>
    <link rel="stylesheet" href="css/themes.css">
    <script src="js/engine.js" defer></script>
    <style>
        /* Base page layout container */
        #toolbox {
            width: 220px;
            background: #2d2d30;
            border-right: 1px solid #3f3f46;
            display: flex;
            flex-direction: column;
            padding: 10px;
            gap: 10px;
        }
        .tool-category {
            font-size: 0.75em;
            text-transform: uppercase;
            color: #888;
            margin-top: 5px;
            margin-bottom: 2px;
            letter-spacing: 0.5px;
        }
        .toolbox-btn {
            background: #333337;
            border: 1px solid #3f3f46;
            color: #f1f1f1;
            padding: 8px 12px;
            text-align: left;
            cursor: pointer;
            border-radius: 4px;
            font-size: 0.9em;
            display: flex;
            align-items: center;
            gap: 8px;
            transition: background 0.1s;
        }
        .toolbox-btn:hover {
            background: #3e3e42;
            border-color: #0078d4;
        }
        
        /* Modal Window Styling */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 9999;
        }
        .modal-box {
            background: #252526;
            border: 1px solid #3f3f46;
            width: 400px;
            border-radius: 6px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }
        .modal-header {
            padding: 12px 15px;
            background: #2d2d30;
            border-bottom: 1px solid #3f3f46;
            font-weight: 600;
            font-size: 0.95em;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .modal-body {
            padding: 15px;
            font-size: 0.9em;
            color: #ccc;
            max-height: 300px;
            overflow-y: auto;
        }
        .modal-footer {
            padding: 10px 15px;
            background: #2d2d30;
            border-top: 1px solid #3f3f46;
            display: flex;
            justify-content: flex-end;
        }
    </style>
</head>
<body>

    <!-- TOOLBOX PANEL -->
    <div id="toolbox">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom: 5px;">
            <h2 style="font-size: 1.1em; color: #fff;">Toolbox</h2>
            <button onclick="openSettings()" class="nudge-btn" title="Version & Settings">⚙️</button>
        </div>
        
        <div class="tool-category">Common Controls</div>
        <button class="toolbox-btn" onclick="addControl('Button')">🔲 Button</button>
        <button class="toolbox-btn" onclick="addControl('Label')">🏷️ Label</button>
        <button class="toolbox-btn" onclick="addControl('TextBox')">📝 Text Box</button>
        <button class="toolbox-btn" onclick="addControl('CheckBox')">☑️ Check Box</button>
        <button class="toolbox-btn" onclick="addControl('RadioButton')">🔘 Radio Button</button>
        
        <div class="tool-category">Advanced Controls</div>
        <button class="toolbox-btn" onclick="addControl('Dropdown')">▼ Dropdown (ComboBox)</button>
        <button class="toolbox-btn" onclick="addControl('MenuBar')">📋 Menu Bar</button>
        <button class="toolbox-btn" onclick="addControl('TabControl')">📂 Tab Control</button>
    </div>

    <!-- WORKSPACE CANVAS -->
    <div id="workspace">
        <div id="live-preview-canvas" class="live-preview-canvas"></div>
    </div>

    <!-- SIDEBAR PROPERTY & CODE INSPECTOR -->
    <div id="sidebar">
        <div style="display: flex; background: #2d2d30; border-bottom: 1px solid #3f3f46;">
            <button id="btn-tab-props" onclick="switchSidebarTab('properties')" style="flex:1; background:#333; border:none; color:#fff; padding:10px; cursor:pointer; font-size:0.85em; font-weight:600;">Properties</button>
            <button id="btn-tab-code" onclick="switchSidebarTab('code')" style="flex:1; background:#252526; border:none; color:#aaa; padding:10px; cursor:pointer; font-size:0.85em; font-weight:600;">Code Exporter</button>
        </div>
        <div id="props-content" style="flex-grow: 1; overflow-y: auto;">
            <!-- Dynamically populated properties -->
        </div>
    </div>

    <!-- SETTINGS & VERSION MODAL -->
    <div id="settings-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-header">
                <span>Application & File Versions</span>
                <button onclick="closeSettings()" class="nudge-btn">✕</button>
            </div>
            <div class="modal-body">
                <p style="margin-bottom: 10px;">Tracked independent file versions for the GUI Designer workspace:</p>
                <ul id="version-list-container" style="list-style-type: disc; padding-left: 20px; display:flex; flex-direction:column; gap:6px;">
                    <!-- Populated via script -->
                </ul>
            </div>
            <div class="modal-footer">
                <button class="tool-btn" onclick="closeSettings()">Close</button>
            </div>
        </div>
    </div>

</body>
</html>
