<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Build-GuiForge</title>
    <link rel="stylesheet" href="css/winforms.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; margin: 0; display: flex; height: 100vh; background: #1e1e1e; color: #d4d4d4; }
        
        /* The Toolbox (Left) */
        #toolbox { width: 200px; background: #252526; border-right: 1px solid #333; padding: 15px; display: flex; flex-direction: column; gap: 10px; }
        .tool-btn { padding: 10px; background: #3c3c3c; border: 1px solid #555; color: white; cursor: pointer; text-align: left; border-radius: 4px; }
        .tool-btn:hover { background: #505050; }

        /* The Canvas (Center) */
        #workspace { flex: 1; padding: 20px; background: #333; display: flex; justify-content: center; align-items: center; overflow: auto; }
        #live-preview-canvas { width: 600px; min-height: 400px; position: relative; } /* position: relative is crucial for moving elements later */
        
        /* The Properties Grid (Right) */
        #properties-panel { width: 300px; background: #252526; border-left: 1px solid #333; display: flex; flex-direction: column; }
        #props-header { padding: 15px; background: #1e1e1e; border-bottom: 1px solid #333; font-weight: bold; }
        .prop-group { padding: 10px 15px; border-bottom: 1px solid #333; display: flex; flex-direction: column; gap: 5px; }
        .prop-group label { font-size: 0.85em; color: #aaa; }
        .prop-group input, .prop-group textarea { width: 100%; padding: 5px; background: #1e1e1e; border: 1px solid #555; color: white; box-sizing: border-box; }
        .prop-group textarea { resize: vertical; min-height: 80px; font-family: Consolas, monospace; }
        
        /* Interactive element styling */
        .canvas-element { cursor: pointer; }
        .canvas-element:hover { outline: 1px dashed #0078d4; }
        .selected-element { outline: 2px solid #0078d4 !important; }
    </style>
</head>
<body>

    <div id="toolbox">
        <h3 style="margin-top:0;">Toolbox</h3>
        <button class="tool-btn" onclick="addControl('Button')">➕ Button</button>
        <button class="tool-btn" onclick="addControl('TextBox')">➕ TextBox</button>
        <button class="tool-btn" onclick="addControl('Label')">➕ Label</button>
        <button class="tool-btn" onclick="addControl('CheckBox')">➕ CheckBox</button>
        <button class="tool-btn" onclick="addControl('ComboBox')">➕ Dropdown</button>
    </div>

    <div id="workspace" class="theme-winforms">
        <div id="live-preview-canvas" data-title="My Custom Tool">
            <!-- Elements dropped here -->
        </div>
    </div>

    <div id="properties-panel">
        <div id="props-header">Properties</div>
        <div id="props-content">
            <div style="padding: 15px; color: #888;">Select an element on the canvas to edit its properties.</div>
        </div>
    </div>

    <script src="js/engine.js"></script>
</body>
</html>
